<div class="dashboard-content">
  <div class="welcome-banner">
    <h2>Welcome back, John! 👋</h2>
    <p>Here is an overview of your applications.</p>
  </div>

  <div class="stats-grid">
    <div class="stat-card">
      <div class="stat-icon icon-blue">
        <i class="pi pi-users"></i>
      </div>
      <div class="stat-info">
        <h3>120</h3>
        <span>Total Users</span>
      </div>
    </div>

    <div class="stat-card">
      <div class="stat-icon icon-green">
        <i class="pi pi-chart-line"></i>
      </div>
      <div class="stat-info">
        <h3>34</h3>
        <span>Active Projects</span>
      </div>
    </div>

    <div class="stat-card">
      <div class="stat-icon icon-orange">
        <i class="pi pi-check-square"></i>
      </div>
      <div class="stat-info">
        <h3>12</h3>
        <span>Tasks Pending</span>
      </div>
    </div>

    <div class="stat-card">
      <div class="stat-icon icon-purple">
        <i class="pi pi-calendar"></i>
      </div>
      <div class="stat-info">
        <h3>5</h3>
        <span>Events Today</span>
      </div>
    </div>
  </div>

  <div class="apps-grid">
    <div class="app-card card-blue">
      <div class="app-card-header">
        <div class="app-icon bg-blue">
          <i class="pi pi-table"></i>
        </div>
        <div class="app-title">
          <h3>App One</h3>
          <span class="sub-text">(Table)</span>
        </div>
      </div>
      <p>View and manage records in a data table.</p>
      <a routerLink="/table" class="app-btn btn-blue">Go to App One &rarr;</a>
    </div>

    <div class="app-card card-green">
      <div class="app-card-header">
        <div class="app-icon bg-green">
          <i class="pi pi-file"></i>
        </div>
        <div class="app-title">
          <h3>App Two</h3>
          <span class="sub-text">(Data)</span>
        </div>
      </div>
      <p>View important information and details.</p>
      <a routerLink="/data" class="app-btn btn-green">Go to App Two &rarr;</a>
    </div>
  </div>
</div>
